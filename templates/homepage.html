<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum LAB - homepage</title>
    <link rel="stylesheet" href="../static/styles/main.css">
    <link rel="stylesheet" href="../static/styles/homepage.css">
</head>
<body>
        <main id="aplicativo">


        <!-- =========================================
             CABEÇALHO
        ========================================== -->

        <header id="cabecalho">

            <a href="#" class="logo">
                <img
                    src="../static/images/quark-homepage.png"
                    alt="Logo QuantumLAB"
                >
            </a>

        </header>



        <!-- =========================================
             SEÇÃO DE BOAS-VINDAS
        ========================================== -->

        <section id="boas-vindas" class="secao-boas-vindas">

            <div class="texto-boas-vindas">

                <h1>
                    Olá,
                    <span class="nome-usuario">User</span>
                </h1>

                <p>
                    Vamos observar o que vem a seguir?
                </p>

            </div>


            <figure class="mascote-boas-vindas">

                <img
                    src="imagens/mascote-quantumlab.png"
                    alt="Mascote do QuantumLAB"
                >

            </figure>

        </section>



        <!-- =========================================
             SEÇÃO DO MÓDULO ATUAL
        ========================================== -->

        <section id="modulo-atual" class="secao-modulo-atual">


            <article class="cartao-modulo">

                <div class="informacoes-modulo">

                    <header class="cabecalho-modulo">

                        <h2>Módulo 1</h2>

                        <h3>Capítulo 2</h3>

                    </header>


                    <div class="conteudo-modulo">

                        <div class="descricao-modulo">

                            <h4>
                                Dualidade onda-partícula
                            </h4>

                            <p>
                                70% concluído
                            </p>

                        </div>


                        <a href="#" class="botao-retomar">
                            Retomar
                        </a>

                    </div>

                </div>



                <!-- Indicadores laterais do módulo -->

                <nav
                    class="indicadores-modulo"
                    aria-label="Navegação entre módulos"
                >

                    <button
                        class="indicador indicador-ativo"
                        aria-label="Módulo 1"
                    ></button>

                    <button
                        class="indicador indicador-ativo"
                        aria-label="Módulo 2"
                    ></button>

                    <button
                        class="indicador"
                        aria-label="Módulo 3"
                    ></button>

                    <button
                        class="indicador"
                        aria-label="Módulo 4"
                    ></button>

                    <button
                        class="indicador"
                        aria-label="Módulo 5"
                    ></button>

                </nav>

            </article>

        </section>



        <!-- =========================================
             SEÇÃO DE EXPERIÊNCIA / XP
        ========================================== -->

        <section id="experiencia" class="secao-experiencia">

            <div class="barra-experiencia">

                <span class="titulo-experiencia">
                    XP
                </span>


                <div class="progresso-experiencia">

                    <progress
                        class="barra-progresso-xp"
                        value="60"
                        max="100"
                    >
                        60 de 100 XP
                    </progress>

                    <span class="quantidade-xp">
                        60 / 100
                    </span>

                </div>


                <div class="nivel-usuario">

                    <img
                        src="imagens/icone-nivel.svg"
                        alt=""
                    >

                    <span class="numero-nivel">
                        2
                    </span>

                </div>

            </div>

        </section>



        <!-- =========================================
             SEÇÃO DA TRILHA DE APRENDIZADO
        ========================================== -->

        <section id="trilha-aprendizado" class="secao-trilha">


            <header class="cabecalho-trilha">

                <h2>
                    Sua
                    <span>trilha</span>
                </h2>

                <p>
                    Acompanhe sua jornada
                </p>

            </header>



            <div class="trilha">


                <!-- Etapa 1 -->

                <article class="etapa-trilha etapa-iniciar">

                    <div class="circulo-etapa">

                        <img
                            src="imagens/icone-bandeira.svg"
                            alt=""
                        >

                    </div>

                    <h3>
                        Iniciar
                    </h3>

                </article>



                <!-- Etapa 2 -->

                <article class="etapa-trilha etapa-aprender">

                    <h3>
                        Aprender
                    </h3>

                    <div class="circulo-etapa">

                        <img
                            src="imagens/icone-livro.svg"
                            alt=""
                        >

                    </div>

                </article>



                <!-- Etapa 3 -->

                <article class="etapa-trilha etapa-fixar">

                    <div class="marcador-posicao">

                        <img
                            src="imagens/icone-bandeira-azul.svg"
                            alt="Etapa atual"
                        >

                    </div>


                    <div class="circulo-etapa">

                        <img
                            src="imagens/icone-quebra-cabeca.svg"
                            alt=""
                        >

                    </div>

                    <h3>
                        Fixar
                    </h3>

                </article>



                <!-- Etapa 4 -->

                <article class="etapa-trilha etapa-experimentar">

                    <h3>
                        Experimentar
                    </h3>

                    <div class="circulo-etapa">

                        <img
                            src="imagens/icone-atomo.svg"
                            alt=""
                        >

                    </div>

                </article>



                <!-- Etapa 5 -->

                <article class="etapa-trilha etapa-concluir">

                    <div class="circulo-etapa">

                        <img
                            src="imagens/icone-trofeu.svg"
                            alt=""
                        >

                    </div>

                    <h3>
                        Concluir
                    </h3>

                </article>


            </div>

        </section>



        <!-- =========================================
             NAVEGAÇÃO INFERIOR
        ========================================== -->

        <nav
            id="navegacao-inferior"
            class="menu-inferior"
            aria-label="Menu principal"
        >


            <a
                href="#"
                class="item-menu"
                aria-label="Trilha de aprendizado"
            >

                <img
                    src="imagens/icone-livro-menu.svg"
                    alt=""
                >

            </a>



            <a
                href="#"
                class="item-menu"
                aria-label="Atividades"
            >

                <img
                    src="imagens/icone-lista.svg"
                    alt=""
                >

            </a>

            <a
                href="#"
                class="item-menu item-menu-ativo"
                aria-label="Página inicial"
                aria-current="page"
            >

                <img
                    src="imagens/icone-inicio.svg"
                    alt=""
                >

            </a>

            <a
                href="#"
                class="item-menu"
                aria-label="Laboratório"
            >

                <img
                    src="imagens/icone-mapa.svg"
                    alt=""
                >

            </a>

            <a
                href="#"
                class="item-menu"
                aria-label="Perfil"
            >

                <img src="imagens/icone-perfil.svg" alt="" >

            </a>

        </nav>

    </main>

</body>
</html>
